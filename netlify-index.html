.profile-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px}.profile-stats>div{display:flex;flex-direction:column;gap:8px}.profile-stats strong{font-size:34px;color:var(--lime)}.profile-stats small{font-size:18px}.profile-stats span{font-size:15px;color:var(--muted)}
.profile-match{margin-bottom:16px;overflow:hidden}.personal-result{padding:12px 24px 0;font-size:14px;font-weight:600}.personal-result.won{color:var(--lime)}.personal-result.lost{color:var(--muted)}.player-link.profile-self,.player-link.profile-self:hover{font-weight:700;color:var(--lime);text-decoration:none}
@media(max-width:680px){.profile-hero{padding:22px}.profile-stats{gap:10px}.profile-stats strong{font-size:30px}.profile-stats small{font-size:16px}.personal-result{padding:14px 14px 0}.draw-home .team-members .player-link{gap:6px}}

.profile-match .match-result{display:none}.profile-match .match-score{padding-top:0}
.profile-match.won{background:#202819;border-color:#404b30}.profile-match.lost{background:#212121;border-color:#3e3e3e}
.profile-match .profile-self{color:var(--ink);font-weight:700;text-decoration:none}
.profile-match.lost .personal-result{color:#bdc3bb}

/* Compact personal match history. */
.compact-match{padding:14px 24px;border-radius:24px;margin-bottom:12px}
.compact-match-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.compact-outcome{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.compact-outcome strong{font-size:20px}.compact-match.won .compact-outcome{color:var(--lime)}
.match-praise{flex-shrink:0;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.2);font-size:15px;font-weight:600}
.compact-opponents{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:10px;font-size:17px;line-height:1.5}
.compact-opponents>span{white-space:nowrap}.compact-opponents .versus{color:var(--muted);font-size:14px}
.compact-match-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;font-size:13px;color:var(--muted)}
.compact-match-foot .text-btn{padding:4px 0;min-height:28px;font-size:13px}
@media(max-width:680px){.compact-match{padding:12px 18px;border-radius:22px}.compact-outcome{font-size:22px;gap:10px}.compact-outcome strong{font-size:20px}.match-praise{font-size:14px;padding:5px 8px}.compact-opponents{font-size:16px;gap:4px 8px;margin-top:9px}}

.rename-round{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;margin-left:8px;padding:6px;min-width:32px;min-height:32px}

/* Anchor navigation directly to the viewport, without fixing the page shell. */
@media(max-width:680px){
 .sidebar{position:fixed;inset:auto 0 0;bottom:0;width:100%;height:auto;min-height:72px;padding:0 10px env(safe-area-inset-bottom,0px);margin:0;background:#13190f;backdrop-filter:none;-webkit-backdrop-filter:none;transform:translateZ(0)}
 .sidebar nav{height:72px;flex-shrink:0}
 .sidebar:after{content:'';position:absolute;top:100%;left:0;right:0;height:100px;background:#13190f;pointer-events:none}
}

.summary-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.summary-strip>div{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.summary-strip strong,.summary-strip span{text-align:center}
